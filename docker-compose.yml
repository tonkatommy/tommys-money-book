# Tommy's Money Book — homelab deployment
#
# Two services for Phase 0: the Next.js app and Postgres. The sync worker
# joins as a third service in Phase 1.
#
# Usage:
#   cp .env.example .env   (then set a real POSTGRES_PASSWORD)
#   docker compose up -d db          # dev: db only, app via `npm run dev`
#   docker compose up -d --build     # full stack

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneybook}
      # ${VAR:?message} makes compose refuse to start with an empty password
      # rather than silently running an unprotected database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moneybook}
    ports:
      # Bound to localhost only — the app container reaches the db over the
      # compose network; this mapping exists just so `npm run dev` and
      # `prisma migrate` on the host can connect.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-moneybook} -d ${POSTGRES_DB:-moneybook}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      # Explicit, not implied. Without a target, Docker builds the *last*
      # stage in the Dockerfile — so adding the worker stage below it would
      # silently turn this service into a second worker.
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        # Waits for pg_isready, not just "container started" — avoids the app
        # crash-looping while Postgres is still initialising.
        condition: service_healthy
    environment:
      # Inside the compose network the db's hostname is its service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-moneybook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moneybook}
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      # Same Dockerfile, different final stage — see Dockerfile stage 4.
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moneybook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moneybook}
      # Defaults to fixture mode. Set AKAHU_MODE=live in .env once the personal
      # app exists at my.akahu.nz — a missing token then fails fast rather than
      # syncing nothing every morning.
      AKAHU_MODE: ${AKAHU_MODE:-fixture}
      AKAHU_APP_TOKEN: ${AKAHU_APP_TOKEN:-}
      AKAHU_USER_TOKEN: ${AKAHU_USER_TOKEN:-}
      SYNC_CRON: ${SYNC_CRON:-0 7 * * *}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-7}
      SYNC_ON_START: ${SYNC_ON_START:-false}
      # node-cron pins the schedule to Pacific/Auckland itself, but setting TZ
      # too means log timestamps read in NZ time rather than UTC.
      TZ: Pacific/Auckland
    # No ports. The worker reaches out to Postgres and Akahu; nothing reaches in.

  backup:
    # The same Postgres image, purely for its client tools — pg_dump must be
    # the same major version as the server or it refuses to run, and pinning
    # both to one image means that can never drift apart.
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneybook}
      POSTGRES_DB: ${POSTGRES_DB:-moneybook}
      # pg_dump and pg_restore read PGPASSWORD; no password ever appears in a
      # command line, where `ps` would expose it.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: db
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_VERIFY_CRON: ${BACKUP_VERIFY_CRON:-30 3 * * 0}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-7}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      TZ: Pacific/Auckland
    volumes:
      # Read-only: this container runs the scripts, it has no business
      # changing them.
      - ./ops/backup:/opt/backup:ro
      - db-backups:/backups
    entrypoint: ["/opt/backup/entrypoint.sh"]
    # No ports, and no reason to have any.

volumes:
  # Named volume so the data survives `docker compose down`.
  db-data:
  # Separate volume from db-data on purpose. A backup living inside the volume
  # it is protecting is not a backup — `docker volume rm db-data` would take
  # both. Point this at a NAS bind mount rather than a local volume once one
  # is available; that is the difference between surviving a bad command and
  # surviving a dead disk.
  db-backups:
